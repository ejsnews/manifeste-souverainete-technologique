<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<style>text{font-family:Arial,sans-serif;fill:#17351f}.title{font-size:36px;font-weight:700}.h{font-size:22px;font-weight:700}.t{font-size:17px}.small{font-size:14px}</style>
<rect width="1200" height="760" fill="white"/>
<text x="600" y="55" text-anchor="middle" class="title">THE THREE PILLARS OF BIOCHAR VALORIZATION</text>
<circle cx="600" cy="300" r="190" fill="#dfead4" fill-opacity=".8" stroke="#47743d" stroke-width="3"/>
<circle cx="450" cy="470" r="190" fill="#dce9f6" fill-opacity=".8" stroke="#356ca0" stroke-width="3"/>
<circle cx="750" cy="470" r="190" fill="#f8e2c9" fill-opacity=".8" stroke="#d87924" stroke-width="3"/>
<text x="600" y="175" text-anchor="middle" class="h">1. RESTORE &amp; PRESERVE</text><text x="600" y="215" text-anchor="middle" class="t">Soils • water • biodiversity</text><text x="600" y="245" text-anchor="middle" class="t">Carbon storage • resilience</text>
<text x="385" y="455" text-anchor="middle" class="h">2. TRANSFORM</text><text x="385" y="485" text-anchor="middle" class="h">MATERIAL INTO FUNCTIONS</text><text x="385" y="530" text-anchor="middle" class="t">Materials • filtration</text><text x="385" y="560" text-anchor="middle" class="t">Adsorption • industrial uses</text>
<text x="815" y="455" text-anchor="middle" class="h">3. CREATE VALUE</text><text x="815" y="485" text-anchor="middle" class="h">WITHOUT DEGRADING</text><text x="815" y="530" text-anchor="middle" class="t">Materials • heat • energy</text><text x="815" y="560" text-anchor="middle" class="t">Agronomic services • certified removals</text>
<circle cx="600" cy="430" r="92" fill="#17351f"/><text x="600" y="415" text-anchor="middle" style="font:700 21px Arial;fill:white">COHERENT WITH</text><text x="600" y="445" text-anchor="middle" style="font:700 21px Arial;fill:white">THE TERRITORY</text>
<text x="600" y="690" text-anchor="middle" class="t">Environmental integrity, useful functions and economic value must progress together.</text>
<text x="600" y="730" text-anchor="middle" class="small">© Eric Jacob 2026 — World Biochar Atlas — CC BY 4.0</text>
</svg>