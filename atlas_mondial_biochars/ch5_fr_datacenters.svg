<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1980" viewBox="0 0 1400 1980">
<style>text{font-family:Arial,sans-serif;fill:#20332f}.h{font-size:42px;font-weight:bold;fill:white}.s{font-size:19px;fill:#dcece7}.t{font-size:18px}.m{font-size:15px;fill:#53645f}.st{font-size:22px;font-weight:bold}.box{fill:white;stroke:#c6d4cf;stroke-width:2}.gr{fill:#eef8f1;stroke:#78b18b;stroke-width:2}.or{fill:#fff4e7;stroke:#d7a064;stroke-width:2}.bl{fill:#edf6fb;stroke:#78a9c7;stroke-width:2}.pu{fill:#f4f0fa;stroke:#a793c7;stroke-width:2}.G{stroke:#31845a;stroke-width:5;fill:none}.O{stroke:#c87524;stroke-width:5;fill:none}.B{stroke:#347ba5;stroke-width:5;fill:none}</style>
<rect width="1400" height="190" fill="#183f3b"/><text x="70" y="72" class="h">DATACENTER IA + BIOCHAR</text><text x="70" y="116" class="h" style="font-size:32px">Infrastructure territoriale circulaire et bas carbone</text><text x="72" y="158" class="s">Biomasse durable • thermolyse • énergie • chaleur fatale • carbone stable • traçabilité</text>
<rect x="70" y="225" width="1260" height="105" rx="18" class="box"/><text x="100" y="264" class="st">Principe</text><text x="100" y="295" class="t">Coupler un datacenter à des ressources énergétiques bas carbone et à une filière locale de thermolyse,</text><text x="100" y="320" class="t">puis valoriser chaleur, coproduits et biochar sans confondre circularité locale et neutralité carbone automatique.</text>
<text x="70" y="395" class="st">1 — RESSOURCES</text>
<rect x="70" y="430" width="385" height="190" rx="18" class="gr"/><text x="100" y="475" class="st">Biomasse durable</text><text x="100" y="510" class="t">• résidus forestiers et agricoles</text><text x="100" y="540" class="t">• tailles, coproduits, bambou adapté</text><text x="100" y="575" class="m">Préserver sols, biodiversité et usages existants.</text>
<rect x="505" y="430" width="385" height="190" rx="18" class="bl"/><text x="535" y="475" class="st">Électricité bas carbone</text><text x="535" y="510" class="t">• solaire / éolien / hydro</text><text x="535" y="540" class="t">• réseau + stockage selon contexte</text><text x="535" y="575" class="m">Le mix réel doit être mesuré heure par heure.</text>
<rect x="940" y="430" width="390" height="190" rx="18" class="box"/><text x="970" y="475" class="st">Contrainte structurante</text><text x="970" y="510" class="t">Minimiser transport et séchage.</text><text x="970" y="540" class="t">Chercher des débouchés locaux stables.</text><text x="970" y="575" class="m">Toujours raisonner en analyse de cycle de vie.</text>
<text x="70" y="700" class="st">2 — CONVERSION THERMOCHIMIQUE</text><path d="M260 620C260 690 480 680 510 740" class="G"/>
<rect x="350" y="740" width="700" height="190" rx="18" class="or"/><text x="390" y="790" class="st">THERMOLYSE / PYROLYSE CONTRÔLÉE</text><text x="390" y="830" class="t">Biomasse → biochar + gaz / vapeurs + chaleur récupérable</text><text x="390" y="865" class="m">Intrant, température, temps de résidence et conduite déterminent rendement et propriétés.</text><text x="390" y="895" class="m">H₂, carburants ou électricité exigent des étapes spécifiques : ils ne sont pas universels.</text>
<path d="M500 930V1010H250" class="G"/><path d="M700 930V1010" class="O"/><path d="M900 930V1010H1150" class="O"/>
<rect x="70" y="1030" width="390" height="175" rx="18" class="gr"/><text x="100" y="1070" class="st">BIOCHAR — matière</text><text x="100" y="1105" class="t">• sols adaptés / restauration</text><text x="100" y="1135" class="t">• matériaux / filtration</text><text x="100" y="1165" class="m">Carbone stable sous conditions de qualité et d'usage.</text>
<rect x="505" y="1030" width="390" height="175" rx="18" class="or"/><text x="535" y="1070" class="st">GAZ — vecteur</text><text x="535" y="1105" class="t">• énergie du procédé</text><text x="535" y="1135" class="t">• valorisation selon technologie</text><text x="535" y="1165" class="m">Éviter les promesses indépendantes du procédé réel.</text>
<rect x="940" y="1030" width="390" height="175" rx="18" class="or"/><text x="970" y="1070" class="st">CHALEUR — ressource</text><text x="970" y="1105" class="t">• séchage biomasse</text><text x="970" y="1135" class="t">• serre / industrie / réseau</text><text x="970" y="1165" class="m">La distance au consommateur est déterminante.</text>
<text x="70" y="1280" class="st">3 — DATACENTER : CALCUL → CHALEUR</text><path d="M700 620V1310" class="B"/><path d="M700 1205V1310" class="O"/>
<rect x="260" y="1330" width="880" height="230" rx="18" class="bl"/><rect x="310" y="1380" width="125" height="135" rx="8" fill="#315d75"/><rect x="328" y="1400" width="89" height="18" fill="#a7d0df"/><rect x="328" y="1434" width="89" height="18" fill="#a7d0df"/><rect x="328" y="1468" width="89" height="18" fill="#a7d0df"/>
<text x="485" y="1380" class="st">DATACENTER / CALCUL IA</text><text x="485" y="1420" class="t">Électricité → CPU / GPU / stockage / réseau → chaleur fatale</text><text x="485" y="1455" class="t">Le levier territorial : transformer cette chaleur rejetée en ressource utile.</text><text x="485" y="1490" class="m">Température, continuité, distance et saisonnalité conditionnent la récupération.</text><text x="485" y="1520" class="m">Le biochar ne « compense » pas automatiquement le datacenter : le bilan doit être démontré.</text>
<path d="M420 1560V1640H260" class="B"/><path d="M700 1560V1640" class="O"/><path d="M980 1560V1640H1140" class="G"/>
<rect x="70" y="1660" width="390" height="165" rx="18" class="bl"/><text x="100" y="1700" class="st">Pilotage énergétique</text><text x="100" y="1735" class="t">• charge informatique flexible</text><text x="100" y="1765" class="t">• réseau / stockage / renouvelables</text><text x="100" y="1795" class="m">Optimiser avec des données carbone réelles.</text>
<rect x="505" y="1660" width="390" height="165" rx="18" class="or"/><text x="535" y="1700" class="st">Chaleur valorisée</text><text x="535" y="1735" class="t">• réseau de chaleur / serre</text><text x="535" y="1765" class="t">• séchage / industrie / PAC</text><text x="535" y="1795" class="m">Un usage annuel stable maximise l'intérêt.</text>
<rect x="940" y="1660" width="390" height="165" rx="18" class="gr"/><text x="970" y="1700" class="st">Carbone &amp; territoire</text><text x="970" y="1735" class="t">• biochar vers usage approprié</text><text x="970" y="1765" class="t">• stockage durable vérifiable</text><text x="970" y="1795" class="m">Éviter double comptage et allégations excessives.</text>
<rect x="70" y="1850" width="1260" height="82" rx="18" class="pu"/><text x="100" y="1885" class="st">4 — COUCHE DE PREUVE</text><text x="100" y="1915" class="t">Origine biomasse • analyses du biochar • énergie consommée • chaleur réellement utilisée • destination finale • ACV • audit</text>
<rect x="0" y="1945" width="1400" height="35" fill="#183f3b"/><text x="70" y="1968" class="m" style="fill:white">Vert : matière/carbone • Orange : chaleur/énergie • Bleu : électricité/pilotage</text><text x="1330" y="1968" text-anchor="end" class="m" style="fill:white">Atlas mondial du biochar — Eric Jacob — 2026</text>
</svg>